name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Kiểm tra trên Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 là mức thấp nhất package.json hứa hỗ trợ; 22 là bản LTS hiện hành.
        # Chạy cả hai vì đã một lần trượt do dùng tính năng chỉ có ở bản mới.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Chạy toàn bộ bài kiểm tra
        run: npm test
